<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LevelUp by NOMAD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    color-scheme: light dark;
    --bg: #111827;
    --surface: #1f2937;
    --accent: #3b82f6;
    --accent-soft: #1d4ed8;
    --text: #f9fafb;
    --muted: #9ca3af;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Top Bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-bottom: 1px solid #374151;
  }

  .topbar-center {
    flex: 1;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 4px;
  }

  .connection-status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .gear {
    font-size: 22px;
    cursor: pointer;
  }

  /* Main Content */
  .content {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    justify-content: space-evenly;
  }

  .ring-container {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  @media (orientation: landscape) {
    .ring-container {
      flex-direction: row;
      justify-content: space-evenly;
      align-items: center;
    }
  }

  .ring-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .ring-title {
    font-size: 14px;
    color: var(--muted);
  }

  .ring-svg {
    width: 280px;
    height: 280px;
  }

  .angle-readout-inside {
    font-size: 18px;
    font-weight: 600;
    fill: var(--muted);
    text-anchor: middle;
  }

  /* Status Row */
  .status-row {
    display: flex;
    justify-content: space-around;
    background: var(--surface);
    padding: 12px;
    border-radius: 12px;
  }
  .status-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>

<body>

<!-- Top Bar -->
<div class="topbar">

  <div class="connection-status" id="conn-status">
    <span>Network:</span>
    <span id="conn-icon" style="color: var(--green); font-weight: 700;">✓</span>
  </div>

  <div class="topbar-center">
    <span style="font-size: 18px; font-weight: 700;">LevelUp</span>
    <span style="font-size: 16px; opacity: 0.8;">by</span>
    <span style="font-size: 18px; font-weight: 700;">NOMAD</span>
  </div>

  <div class="gear">⚙️</div>
</div>

<!-- Main Content -->
<div class="content">

  <div class="ring-container">

    <!-- Pitch ADI-style gauge -->
    <div class="ring-block">
      <div class="ring-title">FRONT‑TO‑BACK (PITCH)</div>
      <svg id="pitch-svg" class="ring-svg" viewBox="0 0 280 280"></svg>
    </div>

    <!-- Roll ADI-style gauge -->
    <div class="ring-block">
      <div class="ring-title">LEFT‑TO‑RIGHT (ROLL)</div>
      <svg id="roll-svg" class="ring-svg" viewBox="0 0 280 280"></svg>
    </div>

  </div>

  <div class="status-row">
    <div class="status-item">Sensor OK</div>
    <div class="status-item">Power: USB‑C</div>
    <div class="status-item">Alarm: Off</div>
    <div class="status-item">OTA: Ready</div>
  </div>

</div>

<script>
  function setConnection(mode) {
    const icon = document.getElementById("conn-icon");
    if (mode === "wifi") { icon.style.color = "#22c55e"; icon.textContent = "✓"; }
    else if (mode === "ble") { icon.style.color = "#3b82f6"; icon.textContent = "✓"; }
    else if (mode === "ap") { icon.style.color = "#f59e0b"; icon.textContent = "✓"; }
    else { icon.style.color = "#ef4444"; icon.textContent = "✕"; }
  }

  /* ADI-style ring with tear-drop caravan icon + internal degree readout */
  function createAdiRing(svgId) {
    const svg = document.getElementById(svgId);
    const centerX = 140;
    const centerY = 140;

    const outerRadius = 130;
    const innerRadiusMajor = 118;
    const innerRadiusMinor = 122;

    const lines = [];

    for (let deg = 0; deg < 360; deg += 5) {
      const rad = (deg - 90) * Math.PI / 180;
      const isMajor = deg % 10 === 0;

      const rInner = isMajor ? innerRadiusMajor : innerRadiusMinor;
      const rOuter = outerRadius;

      const x1 = centerX + rInner * Math.cos(rad);
      const y1 = centerY + rInner * Math.sin(rad);
      const x2 = centerX + rOuter * Math.cos(rad);
      const y2 = centerY + rOuter * Math.sin(rad);

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("stroke", "#4b5563");
      line.setAttribute("stroke-width", isMajor ? 2 : 1.4);
      line.setAttribute("stroke-linecap", "round");

      svg.appendChild(line);
      lines.push({ element: line, deg, isMajor });
    }

    /* Tear-drop caravan icon */
    const caravan = document.createElementNS("http://www.w3.org/2000/svg", "path");

    caravan.setAttribute("d",
      "M 100 150 \
       Q 100 120 140 120 \
       Q 180 120 180 150 \
       Q 180 165 165 170 \
       L 115 170 \
       Q 100 165 100 150 Z"
    );

    caravan.setAttribute("fill", "#030712");
    caravan.setAttribute("stroke", "#4b5563");
    caravan.setAttribute("stroke-width", 3);
    caravan.setAttribute("id", svgId + "-caravan");

    svg.appendChild(caravan);

    /* Degree readout inside ring */
    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", centerX);
    text.setAttribute("y", centerY + 55);
    text.setAttribute("class", "angle-readout-inside");
    text.setAttribute("id", svgId + "-readout");
    text.textContent = "0.0°";

    svg.appendChild(text);

    return lines;
  }

  const pitchLines = createAdiRing("pitch-svg");
  const rollLines = createAdiRing("roll-svg");

  function classifyColour(angle) {
    const abs = Math.abs(angle);
    if (abs < 1) return "#22c55e";
    if (abs < 3) return "#f59e0b";
    return "#ef4444";
  }

  function updateAdiRing(lines, angle, caravanId, readoutId) {
    let targetDeg = Math.round(angle / 5) * 5;
    targetDeg = ((targetDeg % 360) + 360) % 360;

    const colour = classifyColour(angle);

    lines.forEach(l => {
      const baseWidth = l.isMajor ? 2 : 1.4;
      l.element.setAttribute("stroke-width", baseWidth);
      l.element.setAttribute("stroke", "#4b5563");
    });

    lines.forEach(l => {
      const diff = Math.min(
        Math.abs(l.deg - targetDeg),
        360 - Math.abs(l.deg - targetDeg)
      );

      if (diff === 0) {
        l.element.setAttribute("stroke-width", 4.5);
        l.element.setAttribute("stroke", colour);
      } else if (diff <= 10) {
        l.element.setAttribute("stroke-width", l.isMajor ? 3.2 : 2.2);
        l.element.setAttribute("stroke", colour);
      }
    });

    const caravan = document.getElementById(caravanId);
    caravan.setAttribute("transform", `rotate(${angle}, 140, 140)`);

    const readout = document.getElementById(readoutId);
    readout.textContent = angle.toFixed(1) + "°";
  }

  function updateAngles(pitch, roll) {
    updateAdiRing(pitchLines, pitch, "pitch-svg-caravan", "pitch-svg-readout");
    updateAdiRing(rollLines, roll, "roll-svg-caravan", "roll-svg-readout");
  }

  let demoAngle = 0;
  setInterval(() => {
    demoAngle = (demoAngle + 0.3) % 40;
    const pitch = demoAngle - 20;
    const roll = (demoAngle * 0.7) - 14;
    updateAngles(pitch, roll);
  }, 500);

  setConnection("wifi");
</script>

</body>
</html>

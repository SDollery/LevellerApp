<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LevelUp by NOMAD</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    color-scheme: light dark;
    --bg: #111827;
    --surface: #1f2937;
    --accent: #3b82f6;
    --accent-soft: #1d4ed8;
    --text: #f9fafb;
    --muted: #9ca3af;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Top Bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-bottom: 1px solid #374151;
  }

  .topbar-center {
    flex: 1;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: baseline;
    gap: 4px;
  }

  .connection-status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .gear {
    font-size: 22px;
    cursor: pointer;
  }

  /* Main Content */
  .content {
    flex: 1;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    justify-content: space-evenly;
  }

  .ring-container {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  @media (orientation: landscape) {
    .ring-container {
      flex-direction: row;
      justify-content: space-evenly;
      align-items: center;
    }
  }

  .ring-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .ring-title {
    font-size: 14px;
    color: var(--muted);
  }

  .ring-svg {
    width: 200px;
    height: 200px;
  }

  .angle-readout {
    margin-top: 6px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }

  /* Status Row */
  .status-row {
    display: flex;
    justify-content: space-around;
    background: var(--surface);
    padding: 12px;
    border-radius: 12px;
  }
  .status-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>

<body>

<!-- Top Bar -->
<div class="topbar">

  <!-- Left: Network indicator -->
  <div class="connection-status" id="conn-status">
    <span>Network:</span>
    <span id="conn-icon" style="color: var(--green); font-weight: 700;">✓</span>
  </div>

  <!-- Center: App name -->
  <div class="topbar-center">
    <span style="font-size: 18px; font-weight: 700;">LevelUp</span>
    <span style="font-size: 16px; opacity: 0.8;">by</span>
    <span style="font-size: 18px; font-weight: 700;">NOMAD</span>
  </div>

  <!-- Right: Settings -->
  <div class="gear">⚙️</div>
</div>

<!-- Main Content -->
<div class="content">

  <div class="ring-container">

    <!-- Pitch Ring -->
    <div class="ring-block">
      <div class="ring-title">FRONT‑TO‑BACK (PITCH)</div>
      <svg id="pitch-svg" class="ring-svg" viewBox="0 0 200 200"></svg>
      <div class="angle-readout" id="pitch-readout">0.0°</div>
    </div>

    <!-- Roll Ring -->
    <div class="ring-block">
      <div class="ring-title">LEFT‑TO‑RIGHT (ROLL)</div>
      <svg id="roll-svg" class="ring-svg" viewBox="0 0 200 200"></svg>
      <div class="angle-readout" id="roll-readout">0.0°</div>
    </div>

  </div>

  <!-- Status Row -->
  <div class="status-row">
    <div class="status-item">Sensor OK</div>
    <div class="status-item">Power: USB‑C</div>
    <div class="status-item">Alarm: Off</div>
    <div class="status-item">OTA: Ready</div>
  </div>

</div>

<script>
  /* Connection indicator logic */
  function setConnection(mode) {
    const icon = document.getElementById("conn-icon");

    if (mode === "wifi") {
      icon.style.color = "#22c55e"; // green
      icon.textContent = "✓";
    }
    else if (mode === "ble") {
      icon.style.color = "#3b82f6"; // blue
      icon.textContent = "✓";
    }
    else if (mode === "ap") {
      icon.style.color = "#f59e0b"; // orange
      icon.textContent = "✓";
    }
    else if (mode === "offline") {
      icon.style.color = "#ef4444"; // red
      icon.textContent = "✕";
    }
  }

  /* Radial ring setup: hybrid 10° major, 5° minor */
  function createRadialRing(svgId) {
    const svg = document.getElementById(svgId);
    const centerX = 100;
    const centerY = 100;
    const outerRadius = 90;
    const innerRadiusMajor = 60;
    const innerRadiusMinor = 70;

    const lines = [];

    for (let deg = 0; deg < 360; deg += 5) {
      const rad = (deg - 90) * Math.PI / 180; // rotate so 0° is at top

      const isMajor = deg % 10 === 0;

      const rInner = isMajor ? innerRadiusMajor : innerRadiusMinor;
      const rOuter = outerRadius;

      const x1 = centerX + rInner * Math.cos(rad);
      const y1 = centerY + rInner * Math.sin(rad);
      const x2 = centerX + rOuter * Math.cos(rad);
      const y2 = centerY + rOuter * Math.sin(rad);

      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", x1);
      line.setAttribute("y1", y1);
      line.setAttribute("x2", x2);
      line.setAttribute("y2", y2);
      line.setAttribute("stroke", "#4b5563");
      line.setAttribute("stroke-width", isMajor ? 2 : 1.2);
      line.setAttribute("stroke-linecap", "round");

      svg.appendChild(line);

      lines.push({ element: line, deg, isMajor });
    }

    return lines;
  }

  const pitchLines = createRadialRing("pitch-svg");
  const rollLines = createRadialRing("roll-svg");

  function classifyColour(angle) {
    const abs = Math.abs(angle);
    if (abs < 1) return "#22c55e";   // green
    if (abs < 3) return "#f59e0b";   // amber
    return "#ef4444";                // red
  }

  function updateRadialRing(lines, angle) {
    // Find closest 5° segment to angle
    let targetDeg = Math.round(angle / 5) * 5;
    // Normalize to 0–360
    targetDeg = ((targetDeg % 360) + 360) % 360;

    const colour = classifyColour(angle);

    lines.forEach(l => {
      // base style
      const baseWidth = l.isMajor ? 2 : 1.2;
      l.element.setAttribute("stroke-width", baseWidth);
      l.element.setAttribute("stroke", "#4b5563");
    });

    // Highlight target and neighbours
    lines.forEach(l => {
      const diff = Math.min(
        Math.abs(l.deg - targetDeg),
        360 - Math.abs(l.deg - targetDeg)
      );

      if (diff === 0) {
        l.element.setAttribute("stroke-width", 4);
        l.element.setAttribute("stroke", colour);
      } else if (diff <= 10) {
        l.element.setAttribute("stroke-width", l.isMajor ? 3 : 2);
        l.element.setAttribute("stroke", colour);
      }
    });
  }

  /* Angle update logic */
  function updateAngles(pitch, roll) {
    document.getElementById("pitch-readout").textContent = pitch.toFixed(1) + "°";
    document.getElementById("roll-readout").textContent = roll.toFixed(1) + "°";

    updateRadialRing(pitchLines, pitch);
    updateRadialRing(rollLines, roll);
  }

  /* Demo movement */
  let demoAngle = 0;
  setInterval(() => {
    demoAngle = (demoAngle + 0.3) % 40; // small oscillation
    const pitch = demoAngle - 20;       // -20 to +20
    const roll = (demoAngle * 0.7) - 14;
    updateAngles(pitch, roll);
  }, 500);

  // Example connection mode
  setConnection("wifi");
</script>

</body>
</html>

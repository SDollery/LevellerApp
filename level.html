<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Caravan Leveller</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    color-scheme: light dark;
    --bg: #111827;
    --surface: #1f2937;
    --accent: #3b82f6;
    --accent-soft: #1d4ed8;
    --text: #f9fafb;
    --muted: #9ca3af;
    --green: #22c55e;
    --amber: #f59e0b;
    --red: #ef4444;
    --blue: #3b82f6;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* Top Bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--surface);
    padding: 12px 16px;
    border-bottom: 1px solid #374151;
  }
  .topbar-left {
    display: flex;
    flex-direction: column;
  }
  .device-name {
    font-size: 16px;
    font-weight: 600;
  }
  .connection-status {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .gear {
    font-size: 22px;
    cursor: pointer;
  }

  /* Main Content */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* Ring + Van */
  .ring-container {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .ring-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .ring-title {
    font-size: 14px;
    color: var(--muted);
  }

  .ring {
    width: 180px;
    height: 180px;
    border-radius: 999px;
    border: 6px solid var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .ring.red { border-color: var(--red); }
  .ring.amber { border-color: var(--amber); }

  .van {
    width: 110px;
    height: 60px;
    border-radius: 10px;
    border: 3px solid #4b5563;
    position: relative;
    background: #030712;
  }
  .wheel {
    width: 14px;
    height: 14px;
    background: #4b5563;
    border-radius: 999px;
    position: absolute;
    bottom: -8px;
  }
  .wheel.left { left: 20px; }
  .wheel.right { right: 20px; }

  .angle-readout {
    position: absolute;
    bottom: -28px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    width: 100%;
  }

  /* Status Row */
  .status-row {
    display: flex;
    justify-content: space-around;
    background: var(--surface);
    padding: 12px;
    border-radius: 12px;
  }
  .status-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
  }

  /* Bottom Buttons */
  .bottom-buttons {
    display: flex;
    justify-content: space-around;
    padding: 12px 16px;
    border-top: 1px solid #374151;
    background: var(--surface);
  }
  .btn {
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    border: none;
    cursor: pointer;
  }
  .btn:hover {
    background: var(--accent-soft);
  }

</style>
</head>

<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-left">
    <div class="device-name">Caravan Leveller</div>

    <div class="connection-status" id="conn-status">
      <span id="conn-icon" style="color:#22c55e;">✔️</span>
      <span id="conn-text">Wi‑Fi Connected</span>
    </div>
  </div>

  <div class="gear">⚙️</div>
</div>

<!-- Main Content -->
<div class="content">

  <div class="ring-container">

    <!-- Pitch Ring -->
    <div class="ring-block">
      <div class="ring-title">FRONT‑TO‑BACK (PITCH)</div>
      <div class="ring green" id="pitch-ring">
        <div class="van">
          <div class="wheel left"></div>
          <div class="wheel right"></div>
        </div>
        <div class="angle-readout" id="pitch-readout">0.0°</div>
      </div>
    </div>

    <!-- Roll Ring -->
    <div class="ring-block">
      <div class="ring-title">LEFT‑TO‑RIGHT (ROLL)</div>
      <div class="ring green" id="roll-ring">
        <div class="van">
          <div class="wheel left"></div>
          <div class="wheel right"></div>
        </div>
        <div class="angle-readout" id="roll-readout">0.0°</div>
      </div>
    </div>

  </div>

  <!-- Status Row -->
  <div class="status-row">
    <div class="status-item">Sensor OK</div>
    <div class="status-item">Power: USB‑C</div>
    <div class="status-item">Alarm: Off</div>
    <div class="status-item">OTA: Ready</div>
  </div>

</div>

<!-- Bottom Buttons -->
<div class="bottom-buttons">
  <button class="btn">Calibrate</button>
  <button class="btn">Advanced</button>
</div>

<script>
  /* Connection indicator logic */
  function setConnection(mode) {
    const icon = document.getElementById("conn-icon");
    const text = document.getElementById("conn-text");

    if (mode === "wifi") {
      icon.style.color = "#22c55e"; // green
      text.textContent = "Wi‑Fi Connected";
    }
    else if (mode === "ble") {
      icon.style.color = "#3b82f6"; // blue
      text.textContent = "Bluetooth Connected";
    }
    else if (mode === "ap") {
      icon.style.color = "#f59e0b"; // orange
      text.textContent = "AP Mode Active";
    }
  }

  /* Angle update logic */
  function updateAngles(pitch, roll) {
    document.getElementById("pitch-readout").textContent = pitch.toFixed(1) + "°";
    document.getElementById("roll-readout").textContent = roll.toFixed(1) + "°";

    const pitchRing = document.getElementById("pitch-ring");
    const rollRing = document.getElementById("roll-ring");

    function classify(angle) {
      if (Math.abs(angle) < 1) return "green";
      if (Math.abs(angle) < 3) return "amber";
      return "red";
    }

    pitchRing.className = "ring " + classify(pitch);
    rollRing.className = "ring " + classify(roll);
  }

  /* Demo movement */
  let demoAngle = 0;
  setInterval(() => {
    demoAngle = (demoAngle + 0.2) % 6;
    updateAngles(demoAngle - 3, (demoAngle * 0.7) - 2);
  }, 500);

  /* Example connection mode change */
  // setConnection("wifi");
  // setConnection("ble");
  // setConnection("ap");

</script>

</body>
</html>
